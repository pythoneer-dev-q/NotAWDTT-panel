{{define "modals/wdttInboundModal"}}
<a-modal id="wdtt-inbound-modal" v-model="inboundModal.visible"
  :title="inboundModal.isCreate ? modalTitles.create : modalTitles.edit"
  :confirm-loading="inboundModal.saving" :closable="true" :mask-closable="false"
  :class="themeSwitcher.currentTheme"
  :ok-text="inboundModal.isCreate ? 'Создать' : 'Сохранить'"
  cancel-text="Закрыть"
  @ok="inboundModal.save" width="720px">
  <a-alert type="warning" show-icon style="margin-bottom:16px"
    message="Все настройки применяются из панели. Смена портов/MTU перезапускает VPN-сервер внутри процесса (~5 сек), панель остаётся доступной."></a-alert>
  <a-form layout="horizontal" :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item label='{{ i18n "pages.inbounds.enable" }}'>
      <a-switch v-model="inboundForm.enable"></a-switch>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.inbounds.remark" }}'>
      <a-input v-model.trim="inboundForm.remark" placeholder="WDTT"></a-input>
    </a-form-item>
    <a-form-item label="Тег">
      <a-input v-model.trim="inboundForm.tag" placeholder="wdtt-in"></a-input>
    </a-form-item>
    <a-form-item label="Адрес прослушивания">
      <a-input v-model.trim="inboundForm.listen_host" placeholder="0.0.0.0"></a-input>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip title="Домен или IP в wdtt:// ссылках (DTLS, не HTTPS). Пусто = домен из SSL-сертификата панели, иначе публичный IP">
          Адрес в ссылке <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="inboundForm.server_host"
        :placeholder="inboundForm.default_link_host || inboundForm.server_ip || 'авто'"></a-input>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip title="UDP порт DTLS — основной защищённый вход для клиентов">
          UDP (DTLS) порт <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input-number v-model="inboundForm.dtls_port" :min="1" :max="65535" :style="{ width: '100%' }"></a-input-number>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip title="UDP порт прямого RAW-подключения (WRAP AEAD, максимальная производительность)">
          RAW Direct порт <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input-number v-model="inboundForm.raw_direct_port" :min="1" :max="65535" :style="{ width: '100%' }"></a-input-number>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip title="DNS серверы, выдаваемые клиентам при подключении">
          DNS клиентов <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="inboundForm.dns" placeholder="1.1.1.1"></a-input>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip title="MTU сетевого интерфейса wdtt-raw и пакетов клиентов (обычно 1280 или 1420)">
          MTU <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input-number v-model="inboundForm.mtu" :min="576" :max="1500" :style="{ width: '100%' }"></a-input-number>
    </a-form-item>
    <a-form-item label="Подсеть RAW">
      <a-input :value="inboundForm.raw_subnet || '10.70.0.0/16'" disabled></a-input>
    </a-form-item>
    <a-divider>Расширенные параметры</a-divider>
    <a-form-item>
      <template slot="label">
        <a-tooltip title="Таймаут установки DTLS-сессии в секундах (по умолчанию 30 сек)">
          DTLS handshake, сек <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input-number v-model="inboundForm.handshake_timeout_sec" :min="5" :max="600" :style="{ width: '100%' }"></a-input-number>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip title="Время неактивности сессии в секундах, после которого клиент считается оффлайн">
          Онлайн-таймаут, сек <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input-number v-model="inboundForm.online_timeout_sec" :min="5" :max="600" :style="{ width: '100%' }"></a-input-number>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip title="Интервал обновления статистики нагрузки и трафика (сек)">
          Интервал статистики, сек <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input-number v-model="inboundForm.stats_interval_sec" :min="2" :max="60" :style="{ width: '100%' }"></a-input-number>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip title="Адрес локального API управления сервером (по умолчанию 127.0.0.1:2861)">
          Admin HTTP <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="inboundForm.admin_addr" placeholder="127.0.0.1:2861"></a-input>
    </a-form-item>
  </a-form>
</a-modal>
<script>
  const inboundModal = {
    visible: false,
    saving: false,
    isCreate: false,
    onSaved: null,
    show(data) {
      this.isCreate = false;
      inboundModalApp.loadForm(data);
      this.visible = true;
    },
    showCreate(data) {
      this.isCreate = true;
      inboundModalApp.loadForm(data || new InboundSetting());
      this.visible = true;
    },
    close() {
      this.visible = false;
    },
    async save() {
      await inboundModalApp.saveInbound();
    },
  };

  const inboundModalApp = new Vue({
    delimiters: ['[[', ']]'],
    el: '#wdtt-inbound-modal',
    data: {
      inboundModal,
      inboundForm: new InboundSetting(),
      modalTitles: {
        create: 'Создать WDTT',
        edit: 'Изменить WDTT',
      },
    },
    methods: {
      loadForm(data) {
        this.inboundForm = new InboundSetting(data);
      },
      async saveInbound() {
        this.inboundModal.saving = true;
        try {
          const headers = {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
          };
          if (typeof wdttCsrfToken === 'function') {
            const csrf = wdttCsrfToken();
            if (csrf) {
              headers['X-CSRF-Token'] = csrf;
            }
          }
          const res = await fetch(basePath + 'panel/api/inbound/save', {
            method: 'POST',
            credentials: 'same-origin',
            headers,
            body: JSON.stringify(this.inboundForm.payload(this.inboundModal.isCreate)),
          }).then(r => r.json()).catch(() => null);
          if (res && res.success) {
            this.inboundModal.close();
            if (typeof this.inboundModal.onSaved === 'function') {
              await this.inboundModal.onSaved(res.obj);
            }
          } else {
            this.$message.error((res && res.msg) || 'ошибка сохранения');
            return Promise.reject();
          }
        } finally {
          this.inboundModal.saving = false;
        }
      },
    },
  });
</script>
{{end}}
